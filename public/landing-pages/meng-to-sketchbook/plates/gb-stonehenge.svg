<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1240" width="1760" height="1240">
  <defs>
    <!-- Paper texture & subtle noise -->
    <linearGradient id="paperGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F5EF"/>
      <stop offset="50%" stop-color="#E6E5DD"/>
      <stop offset="100%" stop-color="#D8D6CC"/>
    </linearGradient>
    <linearGradient id="washGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#536D57" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#707785" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E6E5DE" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="crease" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="48%" stop-color="#2b2721" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#1a1714" stop-opacity="0.24"/>
      <stop offset="52%" stop-color="#2b2721" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="inkRough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Open sketchbook spread background (1760 x 1240) -->
  <rect x="0" y="0" width="1760" height="1240" fill="url(#paperGrad)"/>

  <!-- Paper borders & deckle edges -->
  <rect x="40" y="40" width="1680" height="1160" fill="none" stroke="#202422" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="8 6"/>
  <rect x="52" y="52" width="1656" height="1136" fill="none" stroke="#202422" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Center binding gutter crease -->
  <rect x="850" y="0" width="60" height="1240" fill="url(#crease)"/>

  <!-- ================= LEFT PAGE: Editorial Field Notes & Archival Metadata ================= -->
  <g id="left-page" transform="translate(100, 110)">
    <!-- Chapter & Plate header -->
    <text x="0" y="40" font-family="'Instrument Serif', Georgia, serif" font-size="18" letter-spacing="4" fill="#202422" opacity="0.6">CHAPTER 09 • PLATE 076</text>
    <text x="0" y="95" font-family="'Instrument Serif', Georgia, serif" font-size="52" font-weight="400" fill="#202422" letter-spacing="-0.5">Stonehenge</text>
    <text x="0" y="132" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="24" fill="#536D57">Salisbury Plain, United Kingdom</text>

    <!-- Decorative divider line -->
    <line x1="0" y1="165" x2="620" y2="165" stroke="#202422" stroke-opacity="0.18" stroke-width="1.2"/>
    <circle cx="310" cy="165" r="3.5" fill="#536D57"/>

    <!-- Subject & Coordinates block -->
    <rect x="0" y="195" width="620" height="85" rx="4" fill="#E6E5DE" fill-opacity="0.6" stroke="#202422" stroke-opacity="0.12"/>
    <text x="24" y="230" font-family="'Instrument Serif', Georgia, serif" font-size="14" letter-spacing="2" fill="#202422" opacity="0.7">CLASSIFICATION</text>
    <text x="24" y="258" font-family="'Newsreader', Georgia, serif" font-size="18" font-weight="600" fill="#202422">Neolithic Megalithic Ring</text>

    <text x="340" y="230" font-family="'Instrument Serif', Georgia, serif" font-size="14" letter-spacing="2" fill="#202422" opacity="0.7">COORDINATES</text>
    <text x="340" y="258" font-family="'Newsreader', Georgia, serif" font-size="18" fill="#202422">51.1789° N, 1.8262° W</text>

    <!-- Editorial Travel Notes (Paragraph) -->
    <text x="0" y="340" font-family="'Instrument Serif', Georgia, serif" font-size="16" letter-spacing="3" fill="#536D57" opacity="0.9">TRAVEL JOURNAL NOTES</text>
    <foreignObject x="0" y="360" width="620" height="260">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Newsreader', Georgia, serif; font-size: 21px; line-height: 1.62; color: #202422; text-align: justify;">
        “Towering sarsen trilithons and lintels aligned with solstitial sunrise, weathered by four thousand years of Atlantic rain and wind.”
      </div>
    </foreignObject>

    <!-- Architectural & Cultural Observation -->
    <g transform="translate(0, 620)">
      <line x1="0" y1="0" x2="620" y2="0" stroke="#202422" stroke-opacity="0.15" stroke-dasharray="3 3"/>
      <text x="0" y="32" font-family="'Instrument Serif', Georgia, serif" font-size="15" letter-spacing="2.5" fill="#202422" opacity="0.75">FIELD CURATOR ANNOTATION</text>
      <foreignObject x="0" y="48" width="620" height="150">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 18px; line-height: 1.55; color: #202422; opacity: 0.88;">
          Constructed in multiple phases from c. 3000 BC to 2000 BC; blue stones transported from Wales.
        </div>
      </foreignObject>
    </g>

    <!-- Botanical study label & Archival Seal -->
    <g transform="translate(0, 860)">
      <circle cx="60" cy="55" r="45" fill="none" stroke="#536D57" stroke-width="1.8" stroke-opacity="0.6"/>
      <circle cx="60" cy="55" r="40" fill="none" stroke="#536D57" stroke-width="0.8" stroke-dasharray="4 2" stroke-opacity="0.5"/>
      <text x="60" y="52" text-anchor="middle" font-family="'Instrument Serif', serif" font-size="11" letter-spacing="1" fill="#536D57">GB</text>
      <text x="60" y="66" text-anchor="middle" font-family="'Newsreader', serif" font-size="10" font-weight="600" fill="#536D57">076</text>

      <text x="130" y="44" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="16" fill="#202422">Botanical specimen: Quercus robur (English Oak)</text>
      <text x="130" y="70" font-family="'Instrument Serif', Georgia, serif" font-size="13" letter-spacing="3" fill="#202422" opacity="0.6">ROYAL GEOGRAPHICAL FOLIO</text>
    </g>
  </g>

  <!-- ================= RIGHT PAGE: Hand-Drawn Architectural & Watercolor Illustration ================= -->
  <g id="right-page" transform="translate(940, 90)">
    <!-- Decorative border framing the illustration -->
    <rect x="0" y="0" width="720" height="1060" fill="none" stroke="#202422" stroke-opacity="0.16" stroke-width="1.2"/>
    <rect x="10" y="10" width="700" height="1040" fill="none" stroke="#202422" stroke-opacity="0.08" stroke-width="0.8"/>

    <!-- Watercolor wash sky & atmosphere behind drawing -->
    <rect x="18" y="18" width="684" height="640" rx="2" fill="url(#washGrad)" opacity="0.85"/>

    <!-- Organic watercolor spots / blooms -->
    <ellipse cx="280" cy="220" rx="240" ry="160" fill="#536D57" fill-opacity="0.12" filter="url(#inkRough)"/>
    <ellipse cx="480" cy="360" rx="190" ry="140" fill="#707785" fill-opacity="0.15" filter="url(#inkRough)"/>
    <ellipse cx="200" cy="520" rx="160" ry="110" fill="#536D57" fill-opacity="0.08" filter="url(#inkRough)"/>

    <!-- Dynamic Architectural Drawing Elements according to landmark type -->
    <g id="drawing" filter="url(#inkRough)" stroke="#202422" stroke-linecap="round" stroke-linejoin="round">
      
        <!-- Natural Landscape / Mountain / Geological Ridge -->
        <!-- Background Mountain Contours -->
        <path d="M 40,680 Q 220,380 360,240 Q 500,380 680,680" fill="#536D57" fill-opacity="0.16" stroke-width="2.8"/>
        <path d="M 120,700 Q 280,480 360,340 Q 440,480 600,700" fill="none" stroke-width="1.8" stroke-dasharray="6 3"/>
        <!-- Foreground Ridges -->
        <path d="M 20,780 Q 200,620 380,690 Q 540,580 700,760" fill="#707785" fill-opacity="0.22" stroke-width="2.4"/>
        <path d="M 0,860 Q 240,740 480,820 Q 620,760 720,880" fill="#E6E5DE" fill-opacity="0.9" stroke-width="2.4"/>
        <!-- Water reflection / valley floor -->
        <path d="M 40,940 C 240,910 480,950 680,920 M 60,970 C 260,950 460,980 660,960" stroke-width="1.5" stroke-opacity="0.5"/>
        <!-- Alpine pines / vegetation marks -->
        
          <polygon points="100,780 106,740 112,780" fill="#707785" stroke-width="1"/>
        
          <polygon points="138,780 144,740 150,780" fill="#707785" stroke-width="1"/>
        
          <polygon points="176,780 182,740 188,780" fill="#707785" stroke-width="1"/>
        
          <polygon points="214,780 220,740 226,780" fill="#707785" stroke-width="1"/>
        
          <polygon points="252,780 258,740 264,780" fill="#707785" stroke-width="1"/>
        
          <polygon points="290,780 296,740 302,780" fill="#707785" stroke-width="1"/>
        
          <polygon points="328,780 334,740 340,780" fill="#707785" stroke-width="1"/>
        
          <polygon points="366,780 372,740 378,780" fill="#707785" stroke-width="1"/>
        
          <polygon points="404,780 410,740 416,780" fill="#707785" stroke-width="1"/>
        
          <polygon points="442,780 448,740 454,780" fill="#707785" stroke-width="1"/>
        
          <polygon points="480,780 486,740 492,780" fill="#707785" stroke-width="1"/>
        
          <polygon points="518,780 524,740 530,780" fill="#707785" stroke-width="1"/>
        
          <polygon points="556,780 562,740 568,780" fill="#707785" stroke-width="1"/>
        
          <polygon points="594,780 600,740 606,780" fill="#707785" stroke-width="1"/>
        
      

      <!-- Universal Hatching, Stone Texture, and Shading Lines -->
      
        <line x1="160" y1="600" x2="195" y2="625" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="230" y1="600" x2="265" y2="625" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="300" y1="600" x2="335" y2="625" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="370" y1="600" x2="405" y2="625" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="440" y1="600" x2="475" y2="625" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="510" y1="600" x2="545" y2="625" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="160" y1="655" x2="195" y2="680" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="230" y1="655" x2="265" y2="680" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="300" y1="655" x2="335" y2="680" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="370" y1="655" x2="405" y2="680" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="440" y1="655" x2="475" y2="680" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="510" y1="655" x2="545" y2="680" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="160" y1="710" x2="195" y2="735" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="230" y1="710" x2="265" y2="735" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="300" y1="710" x2="335" y2="735" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="370" y1="710" x2="405" y2="735" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="440" y1="710" x2="475" y2="735" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="510" y1="710" x2="545" y2="735" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="160" y1="765" x2="195" y2="790" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="230" y1="765" x2="265" y2="790" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="300" y1="765" x2="335" y2="790" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="370" y1="765" x2="405" y2="790" stroke-width="0.8" opacity="0.45"/>
      
    </g>

    <!-- Field Measure & Elevation Annotation Marks -->
    <g transform="translate(40, 880)">
      <line x1="0" y1="0" x2="640" y2="0" stroke="#202422" stroke-opacity="0.25"/>
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#202422" stroke-opacity="0.4"/>
      <line x1="640" y1="-8" x2="640" y2="8" stroke="#202422" stroke-opacity="0.4"/>
      <text x="320" y="-8" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="14" fill="#202422" opacity="0.75">Elevation study • Scale 1:2500 • Field observations in graphite & watercolor</text>
    </g>

    <!-- Caption on Illustration -->
    <g transform="translate(40, 940)">
      <text x="0" y="30" font-family="'Instrument Serif', Georgia, serif" font-size="32" fill="#202422">Stonehenge</text>
      <text x="0" y="60" font-family="'Newsreader', Georgia, serif" font-size="16" fill="#536D57">Plate 076 — UNITED KINGDOM</text>
      <text x="640" y="60" text-anchor="end" font-family="'Instrument Serif', Georgia, serif" font-size="14" letter-spacing="2" fill="#202422" opacity="0.55">51.1789° N, 1.8262° W</text>
    </g>
  </g>
</svg>