<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1240" width="1760" height="1240">
  <defs>
    <!-- Paper texture & subtle noise -->
    <linearGradient id="paperGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF5E9"/>
      <stop offset="50%" stop-color="#EDE5D5"/>
      <stop offset="100%" stop-color="#DFD5C2"/>
    </linearGradient>
    <linearGradient id="washGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43838E" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#B06B68" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#EDE6D7" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="crease" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="48%" stop-color="#2b2721" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#1a1714" stop-opacity="0.24"/>
      <stop offset="52%" stop-color="#2b2721" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="inkRough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Open sketchbook spread background (1760 x 1240) -->
  <rect x="0" y="0" width="1760" height="1240" fill="url(#paperGrad)"/>

  <!-- Paper borders & deckle edges -->
  <rect x="40" y="40" width="1680" height="1160" fill="none" stroke="#26211C" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="8 6"/>
  <rect x="52" y="52" width="1656" height="1136" fill="none" stroke="#26211C" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Center binding gutter crease -->
  <rect x="850" y="0" width="60" height="1240" fill="url(#crease)"/>

  <!-- ================= LEFT PAGE: Editorial Field Notes & Archival Metadata ================= -->
  <g id="left-page" transform="translate(100, 110)">
    <!-- Chapter & Plate header -->
    <text x="0" y="40" font-family="'Instrument Serif', Georgia, serif" font-size="18" letter-spacing="4" fill="#26211C" opacity="0.6">CHAPTER 11 • PLATE 091</text>
    <text x="0" y="95" font-family="'Instrument Serif', Georgia, serif" font-size="52" font-weight="400" fill="#26211C" letter-spacing="-0.5">Hagia Sophia</text>
    <text x="0" y="132" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="24" fill="#43838E">Sultanahmet, Istanbul, Turkey</text>

    <!-- Decorative divider line -->
    <line x1="0" y1="165" x2="620" y2="165" stroke="#26211C" stroke-opacity="0.18" stroke-width="1.2"/>
    <circle cx="310" cy="165" r="3.5" fill="#43838E"/>

    <!-- Subject & Coordinates block -->
    <rect x="0" y="195" width="620" height="85" rx="4" fill="#EDE6D7" fill-opacity="0.6" stroke="#26211C" stroke-opacity="0.12"/>
    <text x="24" y="230" font-family="'Instrument Serif', Georgia, serif" font-size="14" letter-spacing="2" fill="#26211C" opacity="0.7">CLASSIFICATION</text>
    <text x="24" y="258" font-family="'Newsreader', Georgia, serif" font-size="18" font-weight="600" fill="#26211C">Byzantine Dome & Ottoman Minarets</text>

    <text x="340" y="230" font-family="'Instrument Serif', Georgia, serif" font-size="14" letter-spacing="2" fill="#26211C" opacity="0.7">COORDINATES</text>
    <text x="340" y="258" font-family="'Newsreader', Georgia, serif" font-size="18" fill="#26211C">41.0086° N, 28.9802° E</text>

    <!-- Editorial Travel Notes (Paragraph) -->
    <text x="0" y="340" font-family="'Instrument Serif', Georgia, serif" font-size="16" letter-spacing="3" fill="#43838E" opacity="0.9">TRAVEL JOURNAL NOTES</text>
    <foreignObject x="0" y="360" width="620" height="260">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Newsreader', Georgia, serif; font-size: 21px; line-height: 1.62; color: #26211C; text-align: justify;">
        “A colossal brick dome supported by pendentives seems to hang suspended by a golden chain from heaven, flanked by four red-brick Ottoman minarets.”
      </div>
    </foreignObject>

    <!-- Architectural & Cultural Observation -->
    <g transform="translate(0, 620)">
      <line x1="0" y1="0" x2="620" y2="0" stroke="#26211C" stroke-opacity="0.15" stroke-dasharray="3 3"/>
      <text x="0" y="32" font-family="'Instrument Serif', Georgia, serif" font-size="15" letter-spacing="2.5" fill="#26211C" opacity="0.75">FIELD CURATOR ANNOTATION</text>
      <foreignObject x="0" y="48" width="620" height="150">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Newsreader', Georgia, serif; font-style: italic; font-size: 18px; line-height: 1.55; color: #26211C; opacity: 0.88;">
          Consecrated in 537 AD under Emperor Justinian I; architects Isidore of Miletus and Anthemius of Tralles.
        </div>
      </foreignObject>
    </g>

    <!-- Botanical study label & Archival Seal -->
    <g transform="translate(0, 860)">
      <circle cx="60" cy="55" r="45" fill="none" stroke="#43838E" stroke-width="1.8" stroke-opacity="0.6"/>
      <circle cx="60" cy="55" r="40" fill="none" stroke="#43838E" stroke-width="0.8" stroke-dasharray="4 2" stroke-opacity="0.5"/>
      <text x="60" y="52" text-anchor="middle" font-family="'Instrument Serif', serif" font-size="11" letter-spacing="1" fill="#43838E">TR</text>
      <text x="60" y="66" text-anchor="middle" font-family="'Newsreader', serif" font-size="10" font-weight="600" fill="#43838E">091</text>

      <text x="130" y="44" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="16" fill="#26211C">Botanical specimen: Tulipa gesneriana (Ottoman Tulip)</text>
      <text x="130" y="70" font-family="'Instrument Serif', Georgia, serif" font-size="13" letter-spacing="3" fill="#26211C" opacity="0.6">DER-I SAADET ARCHIVE</text>
    </g>
  </g>

  <!-- ================= RIGHT PAGE: Hand-Drawn Architectural & Watercolor Illustration ================= -->
  <g id="right-page" transform="translate(940, 90)">
    <!-- Decorative border framing the illustration -->
    <rect x="0" y="0" width="720" height="1060" fill="none" stroke="#26211C" stroke-opacity="0.16" stroke-width="1.2"/>
    <rect x="10" y="10" width="700" height="1040" fill="none" stroke="#26211C" stroke-opacity="0.08" stroke-width="0.8"/>

    <!-- Watercolor wash sky & atmosphere behind drawing -->
    <rect x="18" y="18" width="684" height="640" rx="2" fill="url(#washGrad)" opacity="0.85"/>

    <!-- Organic watercolor spots / blooms -->
    <ellipse cx="280" cy="220" rx="240" ry="160" fill="#43838E" fill-opacity="0.12" filter="url(#inkRough)"/>
    <ellipse cx="480" cy="360" rx="190" ry="140" fill="#B06B68" fill-opacity="0.15" filter="url(#inkRough)"/>
    <ellipse cx="200" cy="520" rx="160" ry="110" fill="#43838E" fill-opacity="0.08" filter="url(#inkRough)"/>

    <!-- Dynamic Architectural Drawing Elements according to landmark type -->
    <g id="drawing" filter="url(#inkRough)" stroke="#26211C" stroke-linecap="round" stroke-linejoin="round">
      
        <!-- Classical / Sacred Dome & Spires -->
        <!-- Ground & Portico Steps -->
        <path d="M 60,820 L 660,820 M 80,835 L 640,835 M 100,850 L 620,850" stroke-width="2"/>
        <!-- Main Rotunda / Core -->
        <rect x="160" y="460" width="400" height="360" fill="#EDE6D7" fill-opacity="0.9" stroke-width="2.5"/>
        <!-- Portico Columns -->
        <rect x="180" y="540" width="22" height="280" fill="#EDE6D7" stroke-width="1.4"/><rect x="228" y="540" width="22" height="280" fill="#EDE6D7" stroke-width="1.4"/><rect x="276" y="540" width="22" height="280" fill="#EDE6D7" stroke-width="1.4"/><rect x="324" y="540" width="22" height="280" fill="#EDE6D7" stroke-width="1.4"/><rect x="372" y="540" width="22" height="280" fill="#EDE6D7" stroke-width="1.4"/><rect x="420" y="540" width="22" height="280" fill="#EDE6D7" stroke-width="1.4"/><rect x="468" y="540" width="22" height="280" fill="#EDE6D7" stroke-width="1.4"/><rect x="516" y="540" width="22" height="280" fill="#EDE6D7" stroke-width="1.4"/>
        <polygon points="170,540 360,460 550,540" fill="#EDE6D7" stroke-width="2.2"/>
        <!-- Great Dome -->
        <path d="M 210,460 C 210,260 510,260 510,460 Z" fill="#43838E" fill-opacity="0.18" stroke-width="3.2"/>
        <!-- Ribs -->
        <path d="M 360,260 L 360,460" stroke-width="1.8"/>
        <path d="M 360,260 Q 280,330 260,460" stroke-width="1.4"/>
        <path d="M 360,260 Q 440,330 460,460" stroke-width="1.4"/>
        <!-- Lantern / Spire -->
        <rect x="345" y="220" width="30" height="40" fill="#EDE6D7" stroke-width="1.5"/>
        <line x1="360" y1="180" x2="360" y2="220" stroke-width="2.5"/>
        <circle cx="360" cy="180" r="4.5" fill="#43838E"/>
        <!-- Flanking Minarets or Campaniles -->
        <rect x="100" y="300" width="32" height="520" fill="#EDE6D7" stroke-width="1.8"/>
        <polygon points="100,300 116,220 132,300" fill="#B06B68" fill-opacity="0.4" stroke-width="1.5"/>
        <rect x="588" y="300" width="32" height="520" fill="#EDE6D7" stroke-width="1.8"/>
        <polygon points="588,300 604,220 620,300" fill="#B06B68" fill-opacity="0.4" stroke-width="1.5"/>
      

      <!-- Universal Hatching, Stone Texture, and Shading Lines -->
      
        <line x1="160" y1="600" x2="195" y2="625" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="230" y1="600" x2="265" y2="625" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="300" y1="600" x2="335" y2="625" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="370" y1="600" x2="405" y2="625" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="440" y1="600" x2="475" y2="625" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="510" y1="600" x2="545" y2="625" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="160" y1="655" x2="195" y2="680" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="230" y1="655" x2="265" y2="680" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="300" y1="655" x2="335" y2="680" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="370" y1="655" x2="405" y2="680" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="440" y1="655" x2="475" y2="680" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="510" y1="655" x2="545" y2="680" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="160" y1="710" x2="195" y2="735" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="230" y1="710" x2="265" y2="735" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="300" y1="710" x2="335" y2="735" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="370" y1="710" x2="405" y2="735" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="440" y1="710" x2="475" y2="735" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="510" y1="710" x2="545" y2="735" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="160" y1="765" x2="195" y2="790" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="230" y1="765" x2="265" y2="790" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="300" y1="765" x2="335" y2="790" stroke-width="0.8" opacity="0.45"/>
      
        <line x1="370" y1="765" x2="405" y2="790" stroke-width="0.8" opacity="0.45"/>
      
    </g>

    <!-- Field Measure & Elevation Annotation Marks -->
    <g transform="translate(40, 880)">
      <line x1="0" y1="0" x2="640" y2="0" stroke="#26211C" stroke-opacity="0.25"/>
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#26211C" stroke-opacity="0.4"/>
      <line x1="640" y1="-8" x2="640" y2="8" stroke="#26211C" stroke-opacity="0.4"/>
      <text x="320" y="-8" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="14" fill="#26211C" opacity="0.75">Elevation study • Scale 1:2500 • Field observations in graphite & watercolor</text>
    </g>

    <!-- Caption on Illustration -->
    <g transform="translate(40, 940)">
      <text x="0" y="30" font-family="'Instrument Serif', Georgia, serif" font-size="32" fill="#26211C">Hagia Sophia</text>
      <text x="0" y="60" font-family="'Newsreader', Georgia, serif" font-size="16" fill="#43838E">Plate 091 — TURKEY</text>
      <text x="640" y="60" text-anchor="end" font-family="'Instrument Serif', Georgia, serif" font-size="14" letter-spacing="2" fill="#26211C" opacity="0.55">41.0086° N, 28.9802° E</text>
    </g>
  </g>
</svg>